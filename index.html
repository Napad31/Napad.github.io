<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="เว็บไซต์แสดงผลงานและทักษะของ Napad">
    <title>ความภาคภูมิใจของ NAPAD</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           1. การตั้งค่าทั่วไป (Global Styles)
           ========================================================================== */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Prompt', sans-serif;
            line-height: 1.7;
            margin: 0;
            padding: 0;
            background-color: #FFF5F5; /* สีพื้นหลังขาวอมชมพูพาสเทลแบบคลีนซอฟต์ */
            color: #4A3E3D; /* สีตัวอักษรน้ำตาลเข้มปนเทา สบายสายตา */
        }

        /* ==========================================================================
           2. ส่วนหัวของเว็บ (Header)
           ========================================================================== */
        header {
            background: linear-gradient(135deg, #FFD1DC, #FFA6B9); /* ไล่เฉดสีชมพูหวานละมุนตามธีม */
            color: #5C3D42; 
            padding: 70px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 166, 185, 0.2);
        }

        header h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        header p {
            margin: 12px 0 0;
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
        }

        /* ==========================================================================
           3. ส่วนเนื้อหาหลัก (Container & Sections)
           ========================================================================== */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        section {
            padding: 35px 40px;
            margin: 35px 0;
            background: #FFFFFF; /* กล่องเนื้อหาสีขาวบริสุทธิ์แยกชิ้นตามรูปตัวอย่าง */
            border-radius: 18px; /* ขอบโค้งมนสวยงาม */
            box-shadow: 0 10px 25px rgba(224, 169, 175, 0.15); 
            transition: all 0.3s ease;
        }

        section:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(224, 169, 175, 0.25);
        }

        h2 {
            color: #DE7A8C; /* สีหัวข้อชมพูเข้ม */
            font-size: 1.7rem;
            font-weight: 600;
